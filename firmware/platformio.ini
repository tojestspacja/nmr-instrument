; ESP-IDF build of the instrument firmware (ADR-0005). The Arduino build is legacy (class-board-2026).
[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32@7.1.2
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags = -std=gnu++20 -Wall
